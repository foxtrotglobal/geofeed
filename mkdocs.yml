site_name: GeoFeed
site_description: Search 13 social media platforms by GPS coordinates
site_url: https://foxtrotglobal.github.io/geofeed/
repo_url: https://github.com/foxtrotglobal/geofeed
repo_name: foxtrotglobal/geofeed
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Configuration: configuration.md
      - Running: running.md
  - Platforms:
      - Overview: platforms/index.md
      - YouTube: platforms/youtube.md
      - Twitter / X: platforms/twitter.md
      - Instagram: platforms/instagram.md
      - Bluesky: platforms/bluesky.md
      - Mastodon: platforms/mastodon.md
      - Telegram: platforms/telegram.md
      - Reddit: platforms/reddit.md
      - Snapchat: platforms/snapchat.md
      - TikTok: platforms/tiktok.md
      - Flickr: platforms/flickr.md
      - Facebook: platforms/facebook.md
      - Aparat: platforms/aparat.md
      - Rubika: platforms/rubika.md
  - Deployment:
      - Automated (deploy.sh): deployment/automated.md
      - Manual VPS: deployment/manual.md
      - Docker: deployment/docker.md
      - Cloud Platforms: deployment/cloud.md
  - Reference:
      - CLI: reference/cli.md
      - API: reference/api.md
      - Architecture: reference/architecture.md
      - Adding a Provider: reference/new-provider.md
  - Operations:
      - Maintenance: maintenance.md
      - Contributing: contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/foxtrotglobal/geofeed
  version:
    provider: mike
