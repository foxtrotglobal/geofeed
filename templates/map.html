<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoFeed — Social Media Geo Search</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="sidebar">
    <h1>📍 GeoFeed</h1>
    <p class="subtitle">Search social media by location</p>

    <form id="search-form">
      <label>Latitude
        <input type="number" id="lat" step="any" placeholder="e.g. 40.7128" required />
      </label>
      <label>Longitude
        <input type="number" id="lng" step="any" placeholder="e.g. -74.0060" required />
      </label>
      <label>Radius (km)
        <input type="number" id="radius" value="10" min="1" max="100" />
      </label>
      <label>Keyword (optional)
        <input type="text" id="keyword" placeholder="e.g. protest, concert" />
      </label>

      <div class="platforms">
        <label><input type="checkbox" value="youtube" checked /> YouTube</label>
        <label><input type="checkbox" value="flickr" checked /> Flickr</label>
        <label><input type="checkbox" value="instagram" checked /> Instagram</label>
        <label><input type="checkbox" value="twitter" checked /> X / Twitter</label>
        <label><input type="checkbox" value="tiktok" checked /> TikTok</label>
      </div>

      <button type="submit" id="search-btn">🔍 Search</button>
    </form>

    <div id="status"></div>

    <div id="results-list"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // --- Map setup ---
    const map = L.map('map').setView([40.7128, -74.006], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    let markers = L.layerGroup().addTo(map);
    let searchCircle = null;

    // Platform colors
    const COLORS = {
      youtube:   '#FF0000',
      flickr:    '#0063DC',
      instagram: '#E1306C',
      twitter:   '#1DA1F2',
      tiktok:    '#000000'
    };

    // Click map to set coordinates
    map.on('click', function(e) {
      document.getElementById('lat').value = e.latlng.lat.toFixed(6);
      document.getElementById('lng').value = e.latlng.lng.toFixed(6);
    });

    // --- Search ---
    document.getElementById('search-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const lat = parseFloat(document.getElementById('lat').value);
      const lng = parseFloat(document.getElementById('lng').value);
      const radius = parseFloat(document.getElementById('radius').value);
      const keyword = document.getElementById('keyword').value;
      const platforms = [...document.querySelectorAll('.platforms input:checked')]
        .map(cb => cb.value);

      if (!platforms.length) { alert('Select at least one platform'); return; }

      const btn = document.getElementById('search-btn');
      const status = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = '⏳ Searching...';
      status.textContent = '';

      // Clear previous results
      markers.clearLayers();
      document.getElementById('results-list').innerHTML = '';
      if (searchCircle) map.removeLayer(searchCircle);

      // Show search area
      searchCircle = L.circle([lat, lng], {
        radius: radius * 1000, color: '#6366f1', fillOpacity: 0.08, weight: 1
      }).addTo(map);
      map.fitBounds(searchCircle.getBounds());

      try {
        const resp = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ latitude: lat, longitude: lng, radius_km: radius, keyword, platforms })
        });
        const data = await resp.json();

        if (data.error) {
          status.textContent = '❌ ' + data.error;
          return;
        }

        const posts = data.posts || [];
        status.textContent = `Found ${posts.length} result(s) across ${platforms.length} platform(s)`;

        const listEl = document.getElementById('results-list');
        posts.forEach(post => {
          // Add marker
          if (post.latitude && post.longitude) {
            const color = COLORS[post.platform] || '#888';
            const icon = L.divIcon({
              className: 'custom-marker',
              html: `<div style="background:${color};width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>`,
              iconSize: [14, 14],
              iconAnchor: [7, 7]
            });

            const popupHtml = `
              <div class="popup">
                <strong>[${post.platform}]</strong> @${post.author || 'unknown'}<br/>
                ${post.text ? post.text.substring(0, 120) + '...' : ''}
                ${post.media_url ? '<br/><img src="' + post.media_url + '" style="max-width:200px;margin-top:4px;border-radius:4px"/>' : ''}
                <br/><a href="${post.url}" target="_blank" rel="noopener">Open ↗</a>
                ${post.timestamp ? '<br/><small>' + new Date(post.timestamp).toLocaleString() + '</small>' : ''}
              </div>`;

            L.marker([post.latitude, post.longitude], { icon })
              .bindPopup(popupHtml, { maxWidth: 280 })
              .addTo(markers);
          }

          // Add to sidebar list
          const div = document.createElement('div');
          div.className = 'result-item';
          div.innerHTML = `
            <span class="badge" style="background:${COLORS[post.platform] || '#888'}">${post.platform}</span>
            <a href="${post.url}" target="_blank">${post.text ? post.text.substring(0, 80) : post.post_id}</a>
            <span class="meta">@${post.author || '?'} ${post.location_name ? '· ' + post.location_name : ''}</span>
          `;
          listEl.appendChild(div);
        });

      } catch (err) {
        status.textContent = '❌ Error: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = '🔍 Search';
      }
    });
  </script>
</body>
</html>
